[project]
name = "microgrid"
version = "0.1.0"
description = "Wieloagentowa symulacja dyskretna miejskiej mikrosieci (EV + BESS + OZE) - AGH SSD"
requires-python = ">=3.10"
dependencies = [
    "simpy>=4.1",
    "numpy>=1.26",
    "pandas>=2.1",
    "matplotlib>=3.8",
    "streamlit>=1.38",
    "pydeck>=0.9",
    "scipy>=1.13",
]

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/microgrid"]

[tool.pytest.ini_options]
testpaths = ["tests"]
